name: iOS

on:
  push:
    branches: [main]
    paths: ["mobile/ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["mobile/ios/**", ".github/workflows/ios.yml"]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v7
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build and run unit tests
        # UI tests need a MeshHome server; they run locally (see mobile/ios/README.md).
        run: |
          set -euo pipefail
          sim=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild -project MeshHome.xcodeproj -scheme MeshHome -destination "id=$sim" \
            CODE_SIGNING_ALLOWED=NO -only-testing:MeshHomeTests test | tail -n 30
