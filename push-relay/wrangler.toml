# MeshHome push relay (see README.md). Secrets are set with `wrangler secret put`, never here.
name = "meshhome-push-relay"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
# Keep variables set in the dashboard (such as PAUSED, the off switch) when deploying.
keep_vars = true
# MeshHome's default relay address (the domain's DNS is on Cloudflare):
routes = [{ pattern = "push.meshhome.app", custom_domain = true }]

[vars]
BUNDLE_ID = "app.meshhome"

# Abuse limits (Cloudflare's rate limiting binding; counted per Cloudflare location).
[[ratelimits]]
name = "PUSH_LIMIT"          # per device token
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "REGISTER_LIMIT"      # per client IP
namespace_id = "1002"
simple = { limit = 20, period = 60 }
